<div class="kpis"><div class="kpi"><b>${D.lots.toLocaleString()}</b><span>有效 Lot 數</span></div><div class="kpi"><b>${D.wafers.toLocaleString()}</b><span>Wafer 數</span></div><div class="kpi"><b>${fmt(D.dies)}M</b><span>推算總 die 數</span></div><div class="kpi"><b>${fmt(D.shipD)}M</b><span>實際出貨 die 數</span></div><div class="kpi"><b>${fmt(D.cpD)}M</b><span>CP 實際投入 die 數</span></div><div class="kpi"><b>${(D.shipD/D.dies*100).toFixed(1)}%</b><span>出貨率（出貨÷投入）</span></div><div class="kpi"><b>${D.shipW.toLocaleString()}</b><span>出貨 Wafer 數</span></div><div class="kpi"><b>${D.removed}</b><span>已移除 Lot 數</span></div></div>
<ul><li>Wafer 數＝每個 Lot 的 #1~#25 欄位中有數值的格數</li><li>Die 數＝Wafer 數 × 每片 die 數（35A 開頭 654、50A 開頭 542）</li><li>時間軸以 RUN ON 日期為準；首月（${D.months[0]}）自 ${D.start} 起，末月（${D.months.at(-1)}）僅到 ${D.end}，月量偏低</li><li>出貨規則（每片 WAT 良率 #1~#25）：13U 需 &gt;40%、15U 需 &gt;60%、其餘 Part No 需 &gt;80%；出貨 die 數＝合格 Wafer 數 × 每片 die 數</li><li>CP 實際投入：封裝廠取 die 含 edge die（35A 678、50A 568），CP 實際投入 die 數＝出貨 Wafer 數 × 678 或 568，較晶圓廠出貨量多約 4%</li><li>移除條件：Station、EPI、BGBM 等欄位空白，或 Device Mapping 含 _mapfail</li></ul>`,
()=>`<h2>每月投入、出貨與 CP 實際投入</h2><p class="sub">由左至右：晶圓廠投入（654/542）、晶圓廠出貨（良率篩選後）、CP 實際投入（678/568）</p><div class="row"><div class="chart">${chart({"投入":D.total})}</div><div class="chart">${chart({"出貨":D.totalS})}</div><div class="chart">${chart({"CP實際投入":D.totalC})}</div></div>`,
()=>{const n=v=>Math.round(v).toLocaleString(),T=D.cmp.reduce((a,r)=>({w:a.w+r.w,s:a.s+r.s,e:a.e+r.e,c:a.c+r.c}),{w:0,s:0,e:0,c:0});
 return `<h2>晶圓廠出貨 vs CP 實際投入 對照表</h2><p class="sub">CP 實際投入 ＝ 晶圓廠出貨（良率篩選後）＋ edge die 增加量；皆以實際出貨片數計算，每批不一定 25 片</p>
 <div class="chart" style="overflow:auto"><table><thead><tr><th>Device Mapping</th><th>出貨 Wafer 數</th><th>晶圓廠 die/片</th><th>晶圓廠出貨 die</th><th>Edge die/片</th><th>+ Edge die 增加量</th><th>CP die/片</th><th>＝ CP 實際投入 die</th><th>增加比例</th></tr></thead><tbody>
 ${D.cmp.map(r=>`<tr><td>${r.k}</td><td>${n(r.w)}</td><td>${r.a}</td><td>${n(r.s)}</td><td>${r.b-r.a}</td><td>${n(r.e)}</td><td>${r.b}</td><td>${n(r.c)}</td><td>+${(r.e/r.s*100).toFixed(2)}%</td></tr>`).join('')}
 <tr class="tt"><td>合計</td><td>${n(T.w)}</td><td>－</td><td>${n(T.s)}</td><td>－</td><td>${n(T.e)}</td><td>－</td><td>${n(T.c)}</td><td>+${(T.e/T.s*100).toFixed(2)}%</td></tr></tbody></table></div>
 <ul><li>${D.lt25} 個 Lot 出貨片數少於 25 片；平均每批出貨 ${D.avgPW.toFixed(2)} 片</li><li>被良率門檻擋下的 Wafer 共 ${D.dropW} 片，不送封裝廠，也不計入 CP 投入</li></ul>`},
...["Station","Device Mapping","Part No","EPI","BGBM"].map(d=>()=>`<h2>依 ${names[d]} 的每月${['晶圓廠投入量','晶圓廠出貨量','CP 實際投入量'][mode]}</h2><p class="sub">堆疊柱狀圖，右側為累計量${['與占比','、占比與出貨率','、占比與較出貨增加比例'][mode]}</p>${tabs()}<div class="row"><div class="chart">${chart(D[d+['','_S','_C'][mode]])}</div>${legend(d,mode)}</div>`)];
let p=0;const go=i=>{p=Math.max(0,Math.min(slides.length-1,i));stage.innerHTML=slides[p]();pg.textContent=`${p+1} / ${slides.length}`};
pv.onclick=()=>go(p-1);nx.onclick=()=>go(p+1);
addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key))go(p+1);if(["ArrowLeft","PageUp"].includes(e.key))go(p-1)});
go(0);
</script></body></html>
